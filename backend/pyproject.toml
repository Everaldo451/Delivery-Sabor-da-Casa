[project]
name = "delivery-sabor-da-casa-backend"
version = "0.1.0"
description = "Backend da Delivery Sabor da Casa"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.1",
    "fastapi>=0.110",
    "httpx>=0.27",
    "motor>=3.4",
    "pydantic>=2.6",
    "pyjwt>=2.10",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "sqlmodel>=0.0.24",
    "uvicorn[standard]>=0.29",
    "alembic>=1.20.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-mock>=3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
