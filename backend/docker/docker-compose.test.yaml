name: delivery-test

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test-only-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-sabordacasa}
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:4.4.29
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-sabordacasa}
    tmpfs:
      - /data/db
      - /data/configdb
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    container_name: app
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
    environment:
      PYTHONPATH: /app
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-delivery-test-jwt-secret-key-at-least-32-bytes}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin12345}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-usuario12345}
      POSTGRES_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-test-only-postgres-password}@postgres:5432/${POSTGRES_DB:-sabordacasa}
      MONGO_URL: mongodb://mongodb:27017
      MONGO_DB: ${MONGO_DB:-sabordacasa}
      REDIS_URL: redis://redis:6379/0
      RUN_REPOSITORY_MIGRATIONS: "1"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
